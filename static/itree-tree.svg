<svg xmlns="http://www.w3.org/2000/svg" id="itree-tree" viewBox="0 0 1270 530" role="img" aria-label="The example program unfolded into an iTree">
<defs><marker id="arrow-tree" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#905E43"/></marker><style>
#itree-tree .edge { stroke: #905E43; stroke-width: 2.5; fill: none; marker-end: url(#arrow-tree); }
#itree-tree .vis rect.box { fill: #905E43; }
#itree-tree .vis text { fill: #F7F1EA; font: 500 18px 'SF Mono', Menlo, Monaco, monospace; text-anchor: middle; dominant-baseline: central; }
#itree-tree .vis circle { fill: #EBD5C0; stroke: #905E43; stroke-width: 2.5; }
#itree-tree .vis text.q { fill: #905E43; font: 700 14px -apple-system, BlinkMacSystemFont, sans-serif; }
#itree-tree .tau { fill: #E9E0D7; stroke: #905E43; stroke-width: 3; }
#itree-tree .ret { fill: #EBD5C0; stroke: #905E43; stroke-width: 3; }
#itree-tree .ans { fill: #905E43; font: 600 18px 'SF Mono', Menlo, Monaco, monospace; text-anchor: middle; }
#itree-tree .cond { fill: #7c6f64; font: italic 400 17px -apple-system, BlinkMacSystemFont, sans-serif; text-anchor: middle; }
#itree-tree .legend { fill: #3c3836; font: 400 18px -apple-system, BlinkMacSystemFont, sans-serif; dominant-baseline: central; }
#itree-tree .dots { fill: #3c3836; font: 700 24px -apple-system, BlinkMacSystemFont, sans-serif; text-anchor: middle; }
</style></defs>
